name: CI

# Checks for pull requests, and for what actually lands on main.
#
# Pull requests alone were not enough: this repository merges straight to
# main, so the checks below — the formatting one in particular — had never
# run at all, and 38 files had drifted out of shape before anyone looked.
# Deploy re-runs analyze and test before publishing, but not the formatter,
# so main is where that gate has to be.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  # The functions are dormant — never deployed, because enabling them is a
  # billing decision. That is exactly why this job exists: nothing else here
  # compiles that TypeScript, so it was free to rot until the day somebody
  # turns Blaze on and finds out at the worst moment.
  functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 24 to match what the functions declare they run on, so a build
      # that passes here is a build on the deployed runtime.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Build
        run: npm run build
        working-directory: functions

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 24: @firebase/rules-unit-testing 6 requires it.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json

      # The Firestore emulator is a Java program, and firebase-tools 15 wants
      # Java 21. Pinned rather than left to the runner, whose default JDK is
      # older — the deploy workflow pins the same.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # `npm ci`, not `npm install`: the exact versions in the lockfile, so
      # what is tested here is what the deploy workflow releases with.
      - name: Install dependencies
        run: npm ci
        working-directory: rules-tests

      - name: Run security rules tests
        run: npm test
        working-directory: rules-tests
