name: CI

# Checks for pull requests, and for what actually lands on main.
#
# Pull requests alone were not enough: this repository merges straight to
# main, so the checks below — the formatting one in particular — had never
# run at all, and 38 files had drifted out of shape before anyone looked.
# Deploy re-runs analyze and test before publishing, but not the formatter,
# so main is where that gate has to be.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Firestore emulator is a Java process; ubuntu-latest ships a JDK.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: rules-tests

      - name: Run security rules tests
        run: npm test
        working-directory: rules-tests
